# Local environment for pollux-core.
# NOT IN USE: development runs against a remote Supabase project (see db/CLAUDE.md).
# The `db` service is kept for a possible future self-hosted Postgres setup;
# the api and dashboard services are commented-out placeholders.
name: pollux

services:
  db:
    image: postgres:17-alpine
    container_name: pollux-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pollux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pollux}
      POSTGRES_DB: ${POSTGRES_DB:-pollux}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pollux-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pollux} -d ${POSTGRES_DB:-pollux}"]
      interval: 5s
      timeout: 5s
      retries: 10

